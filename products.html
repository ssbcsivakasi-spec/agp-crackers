<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products — Full Price List | AGP Crackers, Sivakasi</title>
    <meta name="description" content="Browse the full AGP Crackers catalog: sparklers, fountains, chakkars, flower pots, rockets, repeating shots and gift boxes with current 2026 prices." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#7a1f2b" />
    <link rel="canonical" href="https://agpcrackers-demo.example.com/products.html" />
    <link rel="icon" href="assets/logo-badge.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <main id="main">
      <section class="page-hero">
        <div class="wrap">
          <nav aria-label="Breadcrumb"><ol class="crumbs"><li><a href="index.html">Home</a></li><li aria-current="page">Products</li></ol></nav>
          <h1>Our Product Range</h1>
          <p>110 items across 16 categories, priced from our 2026 wholesale &amp; retail price list.</p>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="filter-bar" id="filterBar"></div>
          <div class="toolbar-row">
            <p class="muted small" id="resultCount"></p>
            <div class="view-toggle" role="group" aria-label="Layout">
              <button class="view-btn active" id="gridBtn" aria-pressed="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg> Grid</button>
              <button class="view-btn" id="listBtn" aria-pressed="false"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="3" rx="1.5"/><rect x="3" y="10.5" width="18" height="3" rx="1.5"/><rect x="3" y="17" width="18" height="3" rx="1.5"/></svg> List</button>
            </div>
          </div>
          <div class="p-grid" id="productGrid"></div>
        </div>
      </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
      SZ.renderLayout('products');
      var D = window.SZ_DATA;
      var params = new URLSearchParams(window.location.search);
      var active = params.get('category') || 'all';
      var view = localStorage.getItem('agp_view') || 'grid';

      function renderFilters() {
        var chips = [{ id: 'all', name: 'All Products' }].concat(D.CATEGORIES);
        document.getElementById('filterBar').innerHTML = chips.map(function (c) {
          return '<button class="chip' + (c.id === active ? ' active' : '') + '" data-cat="' + c.id + '">' + c.name + '</button>';
        }).join('');
        SZ.$$('.chip').forEach(function (btn) {
          btn.addEventListener('click', function () {
            active = btn.getAttribute('data-cat');
            var url = new URL(window.location);
            if (active === 'all') url.searchParams.delete('category'); else url.searchParams.set('category', active);
            window.history.replaceState({}, '', url);
            renderFilters();
            renderGrid();
          });
        });
      }

      function applyView() {
        var grid = document.getElementById('productGrid');
        grid.classList.toggle('list-view', view === 'list');
        document.getElementById('gridBtn').classList.toggle('active', view === 'grid');
        document.getElementById('gridBtn').setAttribute('aria-pressed', String(view === 'grid'));
        document.getElementById('listBtn').classList.toggle('active', view === 'list');
        document.getElementById('listBtn').setAttribute('aria-pressed', String(view === 'list'));
      }

      document.getElementById('gridBtn').addEventListener('click', function () { view = 'grid'; localStorage.setItem('agp_view', view); applyView(); });
      document.getElementById('listBtn').addEventListener('click', function () { view = 'list'; localStorage.setItem('agp_view', view); applyView(); });

      function renderGrid() {
        var list = active === 'all' ? D.PRODUCTS : D.inCategory(active);
        document.getElementById('resultCount').textContent = list.length + ' product' + (list.length === 1 ? '' : 's');
        SZ.renderCards('#productGrid', list);
        applyView();
      }

      renderFilters();
      renderGrid();
      SZ.enableCardDrawer('#productGrid');
    </script>
  </body>
</html>
