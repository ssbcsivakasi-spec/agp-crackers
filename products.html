<html lang="en">
  <head>

    <link rel="stylesheet" href="css/styles.css" />
    <meta property="og:type" content="website" />

    <meta id="ogTitle" property="og:title" content="Products — Full Price List | AGP Crackers, Sivakasi" />
    <meta id="ogDescription" property="og:description" content="Browse the full AGP Crackers catalog: sparklers, fountains, chakkars, flower pots, rockets, repeating shots and gift boxes with current 2026 prices." />

  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <main id="main">
      <section class="page-hero">
        <div class="wrap">
          <nav aria-label="Breadcrumb"><ol class="crumbs" id="crumbs"><li><a href="index.html">Home</a></li><li aria-current="page">Products</li></ol></nav>
          <h1 id="pageHeading">Our Product Range</h1>
          <p id="pageSubtitle">110 items across 16 categories, priced from our 2026 wholesale &amp; retail price list.</p>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="filter-bar" id="filterBar"></div>
          <div class="toolbar-row">
            <p class="muted small" id="resultCount"></p>
            <div class="view-toggle" role="group" aria-label="Layout">
              <button class="view-btn active" id="gridBtn" aria-pressed="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg> Grid</button>
              <button class="view-btn" id="listBtn" aria-pressed="false"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="3" rx="1.5"/><rect x="3" y="10.5" width="18" height="3" rx="1.5"/><rect x="3" y="17" width="18" height="3" rx="1.5"/></svg> List</button>
            </div>
          </div>
          <div class="p-grid" id="productGrid"></div>
        </div>
      </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
      SZ.renderLayout('products');
      var D = window.SZ_DATA;
      var params = new URLSearchParams(window.location.search);
      var active = params.get('category') || 'all';
      var view = localStorage.getItem('agp_view') || 'grid';

      function updateSeo() {
        var cat = active === 'all' ? null : D.CATEGORIES.find(function (c) { return c.id === active; });
        var title = cat ? cat.name + ' — Price List | AGP Crackers, Sivakasi' : 'Products — Full Price List | AGP Crackers, Sivakasi';
        var desc = cat
          ? 'Buy ' + cat.name + ' online from AGP Crackers, Sivakasi. ' + cat.blurb + ' Current 2026 prices, order by WhatsApp.'
          : 'Browse the full AGP Crackers catalog: sparklers, fountains, chakkars, flower pots, rockets, repeating shots and gift boxes with current 2026 prices.';
        var url = 'https://agpcrackers.in/products.html' + (cat ? '?category=' + cat.id : '');

        document.title = title;
        document.getElementById('pageTitle').textContent = title;
        document.getElementById('metaDescription').setAttribute('content', desc);
        document.getElementById('metaKeywords').setAttribute('content', cat ? cat.name + ', ' + cat.name.toLowerCase() + ' Sivakasi, buy ' + cat.name.toLowerCase() + ' online, AGP Crackers price list' : document.getElementById('metaKeywords').getAttribute('content'));
        document.getElementById('canonicalLink').setAttribute('href', url);
        document.getElementById('ogTitle').setAttribute('content', title);
        document.getElementById('ogDescription').setAttribute('content', desc);
        document.getElementById('ogUrl').setAttribute('content', url);
        document.getElementById('twitterTitle').setAttribute('content', title);
        document.getElementById('twitterDescription').setAttribute('content', desc);

        document.getElementById('pageHeading').textContent = cat ? cat.name : 'Our Product Range';
        document.getElementById('pageSubtitle').textContent = cat
          ? cat.blurb + ' ' + D.inCategory(cat.id).length + ' items priced from our 2026 wholesale & retail price list.'
          : '110 items across 16 categories, priced from our 2026 wholesale & retail price list.';
        document.getElementById('crumbs').innerHTML = '<li><a href="index.html">Home</a></li>' +
          (cat ? '<li><a href="products.html">Products</a></li><li aria-current="page">' + SZ.escapeHtml(cat.name) + '</li>' : '<li aria-current="page">Products</li>');
      }

      function renderFilters() {
        var chips = [{ id: 'all', name: 'All Products' }].concat(D.CATEGORIES);
        document.getElementById('filterBar').innerHTML = chips.map(function (c) {
          return '<button class="chip' + (c.id === active ? ' active' : '') + '" data-cat="' + c.id + '">' + c.name + '</button>';
        }).join('');
        SZ.$$('.chip').forEach(function (btn) {
          btn.addEventListener('click', function () {
            active = btn.getAttribute('data-cat');
            var url = new URL(window.location);
            if (active === 'all') url.searchParams.delete('category'); else url.searchParams.set('category', active);
            window.history.replaceState({}, '', url);
            renderFilters();
            renderGrid();
            updateSeo();
          });
        });
      }

      function applyView() {
        var grid = document.getElementById('productGrid');
        grid.classList.toggle('list-view', view === 'list');
        document.getElementById('gridBtn').classList.toggle('active', view === 'grid');
        document.getElementById('gridBtn').setAttribute('aria-pressed', String(view === 'grid'));
        document.getElementById('listBtn').classList.toggle('active', view === 'list');
        document.getElementById('listBtn').setAttribute('aria-pressed', String(view === 'list'));
      }

      document.getElementById('gridBtn').addEventListener('click', function () { view = 'grid'; localStorage.setItem('agp_view', view); applyView(); });
      document.getElementById('listBtn').addEventListener('click', function () { view = 'list'; localStorage.setItem('agp_view', view); applyView(); });

      function renderGrid() {
        var list = active === 'all' ? D.PRODUCTS : D.inCategory(active);
        document.getElementById('resultCount').textContent = list.length + ' product' + (list.length === 1 ? '' : 's');
        SZ.renderCards('#productGrid', list);
        applyView();
      }

      renderFilters();
      renderGrid();
      updateSeo();
      SZ.enableCardDrawer('#productGrid');
    </script>
  </body>
</html>
