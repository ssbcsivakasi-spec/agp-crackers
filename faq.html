<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frequently Asked Questions | AGP Crackers</title>
    <meta name="description" content="Answers to common questions about ordering, storing and using AGP Crackers products." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#7a1f2b" />
    <link rel="canonical" href="https://agpcrackers-demo.example.com/faq.html" />
    <link rel="icon" href="assets/logo-badge.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <main id="main">
      <section class="page-hero">
        <div class="wrap">
          <nav aria-label="Breadcrumb"><ol class="crumbs"><li><a href="index.html">Home</a></li><li aria-current="page">FAQ</li></ol></nav>
          <h1>Frequently Asked Questions</h1>
          <p>Common questions about our products and how to order.</p>
        </div>
      </section>

      <section class="section">
        <div class="wrap" style="max-width:820px">
          <div id="faqList"></div>
          <div class="center" style="margin-top:34px">
            <p class="muted">Didn't find your answer?</p>
            <a class="btn btn-primary" href="contact.html">Send an enquiry</a>
          </div>
        </div>
      </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
      SZ.renderLayout('faq');
      var D = window.SZ_DATA;
      document.getElementById('faqList').innerHTML = D.FAQS.map(function (f) {
        return '<details class="faq-item"><summary>' + SZ.escapeHtml(f.q) + '</summary><p>' + SZ.escapeHtml(f.a) + '</p></details>';
      }).join('');
    </script>
  </body>
</html>
