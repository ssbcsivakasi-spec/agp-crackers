    <a class="skip-link" href="#main">Skip to main content</a>
    <main id="main">
      <section class="page-hero">
        <div class="wrap">
          <nav aria-label="Breadcrumb"><ol class="crumbs"><li><a href="index.html">Home</a></li><li aria-current="page">FAQ</li></ol></nav>
          <h1>Frequently Asked Questions</h1>
          <p>Common questions about our products and how to order.</p>

      <section class="section">
        <div class="wrap" style="max-width:820px">
          <div id="faqList"></div>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
      SZ.renderLayout('faq');
      var D = window.SZ_DATA;
      document.getElementById('faqList').innerHTML = D.FAQS.map(function (f) {
        return '<details class="faq-item"><summary>' + SZ.escapeHtml(f.q) + '</summary><p>' + SZ.escapeHtml(f.a) + '</p></details>';
      }).join('');

      var faqSchema = {
        '@context': 'https://schema.org',
        '@type': 'FAQPage',
        mainEntity: D.FAQS.map(function (f) {
          return {
            '@type': 'Question',
            name: f.q,
            acceptedAnswer: { '@type': 'Answer', text: f.a },
          };
        }),
      };
      var schemaScript = document.createElement('script');
      schemaScript.type = 'application/ld+json';
      schemaScript.textContent = JSON.stringify(faqSchema);
      document.head.appendChild(schemaScript);
    </script>
  </body>
